<section id="wa-view-list" class="wa-view wa-view--active">
  <header class="wa-topbar">
    <span class="wa-topbar__title">Watsup</span>
    <div class="wa-topbar__actions">
      <button id="wa-btn-logout" class="wa-iconbtn" type="button" aria-label="Log out" title="Log out">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
      </button>
    </div>
  </header>
  <div class="wa-search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="wa-search-input" type="text" placeholder="Search" autocomplete="off" spellcheck="false">
  </div>
  <div id="wa-chatlist" class="wa-chatlist">
    <div class="wa-state">Loading chats&hellip;</div>
  </div>
</section>

<section id="wa-view-chat" class="wa-view">
  <header class="wa-topbar wa-topbar--chat">
    <button id="wa-btn-back" class="wa-iconbtn" type="button" aria-label="Back">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div id="wa-chat-avatar" class="wa-avatar wa-avatar--sm">?</div>
    <div class="wa-topbar__chatmeta">
      <div id="wa-chat-title" class="wa-topbar__chattitle"></div>
      <div id="wa-chat-sub" class="wa-topbar__chatsub"></div>
    </div>
    <button id="wa-btn-markread" class="wa-iconbtn" type="button" aria-label="Mark as read" title="Mark as read">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/></svg>
    </button>
  </header>
  <div id="wa-msgs" class="wa-msgs">
    <div class="wa-state">Select a chat</div>
  </div>
  <footer class="wa-composer">
    <input id="wa-input" type="text" placeholder="Type a message" autocomplete="off" spellcheck="false">
    <button id="wa-btn-send" class="wa-sendbtn" type="button" aria-label="Send">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </footer>
</section>

<div id="wa-toast" class="wa-toast" hidden></div>
